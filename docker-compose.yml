services:
  qa-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    image: qa-extension-api:latest
    container_name: qa-extension-api
    restart: unless-stopped
    ports:
      - "0.0.0.0:8010:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      APP_PORT_HTTP: 8010
      APP_NAME: qa-extension-api
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      APP_LOG_LEVEL: info
      TRACE_IN_RESPONSE: "true"
      RECORDING_FEATURE_ENABLED: "true"
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: knitto_qa
      DB_HOST_MYSQL: host.docker.internal
      DB_PORT_MYSQL: 3307
      DB_USER_MYSQL: root
      DB_PASS_MYSQL: qa_root_password
      DB_NAME_MYSQL: qa_recorder
      MINIO_ENDPOINT: host.docker.internal
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: qa-recording-artifacts
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}
      RECORDING_UPLOAD_MAX_BYTES: 10485760
      RECORDING_PRESIGN_EXPIRY_SECONDS: 900
      RECORDING_NETWORK_BODY_MAX_BYTES: 262144
      RECORDING_ARTIFACT_CONTENT_TYPES: image/png,image/jpeg,image/webp,application/json,text/plain
      PROJECT_ADMIN_LEVELS: ADMIN,QA,SUPERADMIN,IMPLEMENTOR
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: http://192.168.20.15:20128/v1
      OPENAI_MODEL: ${OPENAI_MODEL:-qa-automation}
      OPENAI_TIMEOUT_MS: 90000
      OPENAI_MAX_OUTPUT_TOKENS: 4000
      EMBEDDING_BASE_URL: http://192.168.20.15:20128/v1
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: openrouter/openai/text-embedding-3-small
      EMBEDDING_DIMENSIONS: 1536
      GRAFANA_URL: http://192.168.20.15:3800
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}
      GRAFANA_LOKI_UID: ${GRAFANA_LOKI_UID:-}
      GRAFANA_PROMETHEUS_UID: ${GRAFANA_PROMETHEUS_UID:-}
      GRAFANA_TEMPO_UID: efh5mi0xofqioe
