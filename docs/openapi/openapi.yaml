openapi: 3.0.3
info:
  title: knitto-backend-boilerplate-ts
  version: 0.0.0
  description: Kontrak HTTP Knitto REST boilerplate (maintained manual; sync saat ubah API).
servers:
  - url: /
    description: Host/port sama dengan Scalar API Reference (browser saat ini)
tags:
  - name: home
    description: Modul umum dan healthcheck (`src/app/http/home`).
  - name: auth
    description: Login, logout, dan autentikasi JWT (`src/app/http/auth`).
  - name: users
    description: Manajemen user.
  - name: programs
    description: Katalog program aplikasi.
  - name: projects
    description: Master project QA.
  - name: test-cases
    description: Test case per project.
  - name: sessions
    description: Sesi recording QA.
  - name: artifacts
    description: Artifact rekaman.
  - name: generations
    description: AI generation untuk sesi.
  - name: codebase
    description: Sinkronisasi dan pencarian codebase.
  - name: observability
    description: Koneksi Grafana dan korelasi sesi.
x-tagGroups:
  - name: Umum
    tags:
      - home
  - name: Autentikasi
    tags:
      - auth
  - name: QA
    tags:
      - users
      - programs
      - projects
      - test-cases
      - sessions
      - artifacts
      - generations
      - codebase
      - observability
security:
  - bearerAuth: []
paths:
  /:
    get:
      tags:
        - home
      summary: Informasi aplikasi dan healthcheck
      operationId: getHome
      responses:
        '200':
          description: Sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnittoSuccessEnvelope'
              example:
                message: Success
                result:
                  APP_NAME: knitto-backend-boilerplate-ts
                  APP_VERSION: 0.0.0
  /auth/login:
    post:
      tags:
        - auth
      summary: Login
      description: Autentikasi pengguna dengan username dan password.
      operationId: postAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: diki
              password: your-password
      responses:
        '200':
          description: Sukses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/KnittoSuccessEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/LoginResult'
              example:
                message: Success
                result:
                  user:
                    id_user: 269
                    nama: Diki IT
                    username: diki
                    input: disable
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
        '400':
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnittoErrorEnvelope'
              example:
                message: Username dan Password harus berupa string
                result: {}
  /auth/logout:
    get:
      tags:
        - auth
      summary: Logout
      description: Mengakhiri sesi pengguna (token JWT).
      operationId: getAuthLogout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sukses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnittoSuccessEnvelope'
              example:
                message: Success
                result: {}
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnittoErrorEnvelope'
  /auth/change-password:
    post:
      tags: [auth]
      summary: Ubah password sendiri
      operationId: postAuthChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnittoSuccessEnvelope'
  /users:
    get:
      tags: [users]
      summary: Daftar user
      operationId: getUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: level
          in: query
          schema: { type: string, enum: [all, SUPERADMIN, ADMIN, QA, IMPLEMENTOR, VIEWER] }
        - name: is_active
          in: query
          schema: { type: string, enum: [all, 'true', 'false'] }
      responses:
        '200':
          description: Daftar user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
    post:
      tags: [users]
      summary: Buat user
      operationId: postUsers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '200':
          description: User berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /users/{id_user}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      summary: Detail user
      operationId: getUser
      responses:
        '200':
          description: Detail user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
    put:
      tags: [users]
      summary: Ubah user
      operationId: putUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: User berhasil diubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
    delete:
      tags: [users]
      summary: Hapus atau nonaktifkan user
      operationId: deleteUser
      responses:
        '200':
          description: User berhasil dihapus atau dinonaktifkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /users/{id_user}/reset-password:
    patch:
      tags: [users]
      summary: Reset password user
      operationId: patchUserPassword
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Password berhasil direset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /programs/active:
    get:
      tags: [programs]
      summary: Daftar program aktif
      operationId: getActivePrograms
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema: { type: string, maxLength: 150 }
        - name: is_active
          in: query
          schema: { type: string, enum: [all, 'true', 'false'] }
      responses:
        '200':
          description: Daftar program aktif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /programs:
    get:
      tags: [programs]
      summary: Daftar program
      operationId: getPrograms
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema: { type: string, maxLength: 150 }
        - name: is_active
          in: query
          schema: { type: string, enum: [all, 'true', 'false'] }
      responses:
        '200':
          description: Daftar program
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
    post:
      tags: [programs]
      summary: Buat program
      operationId: postPrograms
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProgramRequest' }
      responses:
        '200':
          description: Program berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /programs/{id_program}:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    get:
      tags: [programs]
      summary: Detail program
      operationId: getProgram
      responses:
        '200':
          description: Detail program
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
    put:
      tags: [programs]
      summary: Ubah program
      operationId: putProgram
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProgramRequest' }
      responses:
        '200':
          description: Program berhasil diubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
    delete:
      tags: [programs]
      summary: Hapus program
      operationId: deleteProgram
      responses:
        '200':
          description: Program berhasil dihapus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /projects/active:
    get:
      tags: [projects]
      summary: Daftar project aktif
      operationId: getActiveProjects
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema: { type: string, maxLength: 150 }
        - name: id_program
          in: query
          schema: { type: integer, minimum: 1 }
        - name: is_active
          in: query
          schema: { type: string, enum: [all, 'true', 'false'] }
      responses:
        '200':
          description: Daftar project aktif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /projects:
    get:
      tags: [projects]
      summary: Daftar project
      operationId: getProjects
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema: { type: string, maxLength: 150 }
        - name: id_program
          in: query
          schema: { type: integer, minimum: 1 }
        - name: is_active
          in: query
          schema: { type: string, enum: [all, 'true', 'false'] }
      responses:
        '200':
          description: Daftar project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
    post:
      tags: [projects]
      summary: Buat project
      operationId: postProjects
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '200':
          description: Project berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /projects/{id_project}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      summary: Detail project
      operationId: getProjectById
      responses:
        '200':
          description: Detail project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
    put:
      tags: [projects]
      summary: Ubah project
      operationId: putProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectRequest' }
      responses:
        '200':
          description: Project berhasil diubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
    delete:
      tags: [projects]
      summary: Nonaktifkan project
      operationId: deleteProject
      responses:
        '200':
          description: Project berhasil dinonaktifkan atau dihapus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /projects/{id_project}/test-cases:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [test-cases]
      summary: Daftar test case project
      operationId: getProjectTestCases
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: feature
          in: query
          schema: { type: string }
        - name: test_type
          in: query
          schema: { type: string }
        - name: id_program
          in: query
          schema: { type: integer, minimum: 1 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Daftar test case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
    post:
      tags: [test-cases]
      summary: Buat test case
      operationId: postProjectTestCase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseWriteRequest' }
      responses:
        '200':
          description: Test case berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /projects/{id_project}/test-cases/import:
    post:
      tags: [test-cases]
      summary: Import beberapa test case
      operationId: postProjectTestCaseImport
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/TestCaseWriteRequest' }
      responses:
        '200':
          description: Import test case selesai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /projects/{id_project}/test-cases/{id_test_case}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TestCaseId'
    get:
      tags: [test-cases]
      summary: Detail test case
      operationId: getProjectTestCase
      responses:
        '200':
          description: Detail test case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
    put:
      tags: [test-cases]
      summary: Ubah test case
      operationId: putProjectTestCase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTestCaseRequest' }
      responses:
        '200':
          description: Test case berhasil diubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
    delete:
      tags: [test-cases]
      summary: Hapus test case
      operationId: deleteProjectTestCase
      responses:
        '200':
          description: Test case berhasil dihapus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /sessions:
    get:
      tags: [sessions]
      summary: Daftar sesi QA
      operationId: getSessions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: id_project
          in: query
          schema: { type: integer, minimum: 1 }
        - name: tester_user_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: status
          in: query
          schema: { type: string, enum: [recording, completed] }
        - name: result
          in: query
          schema: { type: string, enum: [PASS, FAIL, BLOCKED] }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Daftar sesi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
    post:
      tags: [sessions]
      summary: Buat sesi recording
      operationId: postSessions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '200':
          description: Sesi berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /sessions/active:
    get:
      tags: [sessions]
      summary: Ambil sesi recording aktif milik pengguna
      operationId: getActiveSession
      responses:
        '200':
          description: Sesi aktif atau null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /api/v1/sessions/active:
    get:
      tags: [sessions]
      summary: Alias versi untuk sesi recording aktif
      operationId: getActiveSessionV1
      responses:
        '200':
          description: Sesi aktif atau null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /sessions/active/discard:
    post:
      tags: [sessions]
      summary: Buang sesi aktif yang tertinggal
      operationId: postDiscardActiveSession
      responses:
        '200':
          description: Sesi aktif berhasil dibuang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /api/v1/sessions/active/discard:
    post:
      tags: [sessions]
      summary: Alias versi untuk membuang sesi aktif
      operationId: postDiscardActiveSessionV1
      responses:
        '200':
          description: Sesi aktif berhasil dibuang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /sessions/discard-active:
    post:
      tags: [sessions]
      summary: Alias untuk membuang sesi aktif
      operationId: postDiscardActiveSessionLegacy
      responses:
        '200':
          description: Sesi aktif berhasil dibuang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /sessions/{id_session}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      summary: Detail sesi
      operationId: getSession
      responses:
        '200':
          description: Detail sesi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /sessions/{id_session}/end:
    post:
      tags: [sessions]
      summary: Akhiri sesi dan simpan hasil
      operationId: postEndSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndSessionRequest' }
      responses:
        '200':
          description: Sesi berhasil diakhiri
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /sessions/{id_session}/checkpoints:
    post:
      tags: [sessions]
      summary: Tambah checkpoint sesi
      operationId: postSessionCheckpoint
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCheckpointRequest' }
      responses:
        '200':
          description: Checkpoint berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /sessions/{id_session}/share:
    post:
      tags: [sessions]
      summary: Buat atau ambil URL berbagi sesi
      operationId: postSessionShare
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: URL berbagi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /sessions/share/{share_token}/ai-context:
    get:
      tags: [sessions]
      summary: Ambil konteks AI dari sesi yang dibagikan
      operationId: getSharedSessionAiContext
      security: []
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: Konteks sesi berbagi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /api/v1/sessions/share/{share_token}/ai-context:
    get:
      tags: [sessions]
      summary: Alias versi untuk konteks AI sesi berbagi
      operationId: getSharedSessionAiContextV1
      security: []
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: Konteks sesi berbagi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /sessions/{id_session}/video/upload:
    post:
      tags: [sessions]
      summary: Upload video sesi secara langsung
      operationId: postSessionVideoUpload
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          video/webm:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Video berhasil diunggah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /api/v1/sessions/{id_session}/video/upload:
    post:
      tags: [sessions]
      summary: Alias versi upload video langsung
      operationId: postSessionVideoUploadV1
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          video/webm:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Video berhasil diunggah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /sessions/{id_session}/video/presign-upload:
    post:
      tags: [sessions]
      summary: Buat presigned URL untuk upload video
      operationId: postSessionVideoPresign
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignVideoRequest' }
      responses:
        '200':
          description: Presigned upload URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /api/v1/sessions/{id_session}/video/presign-upload:
    post:
      tags: [sessions]
      summary: Alias versi presigned upload video
      operationId: postSessionVideoPresignV1
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignVideoRequest' }
      responses:
        '200':
          description: Presigned upload URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /sessions/{id_session}/video/complete:
    post:
      tags: [sessions]
      summary: Selesaikan upload video
      operationId: postSessionVideoComplete
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteVideoRequest' }
      responses:
        '200':
          description: Upload video selesai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /api/v1/sessions/{id_session}/video/complete:
    post:
      tags: [sessions]
      summary: Alias versi penyelesaian upload video
      operationId: postSessionVideoCompleteV1
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteVideoRequest' }
      responses:
        '200':
          description: Upload video selesai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
  /sessions/{id_session}/video:
    get:
      tags: [sessions]
      summary: Ambil URL video sesi
      operationId: getSessionVideo
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: URL video
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnittoSuccessEnvelope' }
