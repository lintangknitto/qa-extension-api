components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: id_user
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ProgramId:
      name: id_program
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ProjectId:
      name: id_project
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TestCaseId:
      name: id_test_case
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SessionId:
      name: id_session
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ArtifactId:
      name: id_artifact
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ShareToken:
      name: share_token
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    PerPage:
      name: perPage
      in: query
      schema: { type: integer, minimum: 1, default: 20 }
  schemas:
    KnittoSuccessEnvelope:
      type: object
      required:
        - message
        - result
      properties:
        message:
          type: string
          example: Success
        result:
          type: object
          nullable: true
    KnittoErrorEnvelope:
      type: object
      required:
        - message
        - result
      properties:
        message:
          type: string
        result:
          type: object
          nullable: true
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Nama pengguna
        password:
          type: string
          format: password
          description: Kata sandi
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 6 }
    CreateUserRequest:
      type: object
      required: [nama, username, password, level]
      properties:
        nama: { type: string, minLength: 2, maxLength: 150 }
        username: { type: string, minLength: 3, maxLength: 50, pattern: '^[a-zA-Z0-9._-]+$' }
        password: { type: string, format: password, minLength: 6 }
        level: { type: string, enum: [SUPERADMIN, ADMIN, QA, IMPLEMENTOR, VIEWER] }
        is_active: { type: boolean }
        project_ids:
          type: array
          items: { type: integer, minimum: 1 }
    UpdateUserRequest:
      type: object
      properties:
        nama: { type: string, minLength: 2, maxLength: 150 }
        level: { type: string, enum: [SUPERADMIN, ADMIN, QA, IMPLEMENTOR, VIEWER] }
        is_active: { type: boolean }
        project_ids:
          type: array
          items: { type: integer, minimum: 1 }
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, minLength: 6 }
    CreateProgramRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 3, maxLength: 150 }
        code: { type: string, minLength: 2, maxLength: 60, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        type: { type: string, enum: [FRONTEND, SERVICE, frontend, service] }
        grafana_dashboard_url: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 2000 }
        base_url: { type: string, maxLength: 500 }
        repo_url: { type: string, maxLength: 500 }
        is_active: { type: boolean }
    UpdateProgramRequest:
      type: object
      properties:
        name: { type: string, minLength: 3, maxLength: 150 }
        code: { type: string, minLength: 2, maxLength: 60, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        type: { type: string, enum: [FRONTEND, SERVICE, frontend, service] }
        grafana_dashboard_url: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 2000 }
        base_url: { type: string, maxLength: 500 }
        repo_url: { type: string, maxLength: 500 }
        is_active: { type: boolean }
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        id_program: { type: integer, nullable: true, minimum: 1 }
        program_ids:
          type: array
          items: { type: integer, minimum: 1 }
        name: { type: string, minLength: 3, maxLength: 150 }
        code: { type: string, minLength: 2, maxLength: 60, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        description: { type: string, maxLength: 2000 }
        base_url: { type: string, maxLength: 500 }
        repo_url: { type: string, maxLength: 500 }
        is_active: { type: boolean }
    UpdateProjectRequest:
      type: object
      properties:
        id_program: { type: integer, nullable: true, minimum: 1 }
        program_ids:
          type: array
          items: { type: integer, minimum: 1 }
        name: { type: string, minLength: 3, maxLength: 150 }
        description: { type: string, maxLength: 2000 }
        base_url: { type: string, maxLength: 500 }
        repo_url: { type: string, maxLength: 500 }
        is_active: { type: boolean }
    TestCaseFields:
      type: object
      properties:
        id_program: { type: integer, nullable: true, minimum: 1 }
        test_case_id: { type: string, maxLength: 80 }
        title: { type: string, maxLength: 255 }
        group_no: { type: string, maxLength: 50 }
        feature: { type: string, maxLength: 150 }
        process_no: { type: string, maxLength: 50 }
        test_type: { type: string, maxLength: 10 }
        test_variable: { type: string, maxLength: 255 }
        pre_condition: { type: string }
        test_data: { type: string }
        test_steps: { type: string }
        expected_result: { type: string }
        actual_result: { type: string }
        status: { type: string, maxLength: 30 }
        evidence: { type: string }
        remarks: { type: string }
        automation_tools: { type: string, maxLength: 100 }
    TestCaseWriteRequest:
      allOf:
        - $ref: '#/components/schemas/TestCaseFields'
        - type: object
          required: [test_case_id, title]
    UpdateTestCaseRequest:
      $ref: '#/components/schemas/TestCaseFields'
    CreateSessionRequest:
      type: object
      required: [test_case_no, title]
      properties:
        id_project: { type: integer, nullable: true, minimum: 1 }
        id_test_case: { type: integer, nullable: true, minimum: 1 }
        test_case_no: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 5000, nullable: true }
        target_url: { type: string, maxLength: 1000, nullable: true }
        force_end_previous: { type: boolean }
    EndSessionRequest:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [PASS, FAIL, BLOCKED] }
        actual_result: { type: string, maxLength: 5000 }
    CreateCheckpointRequest:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 2000 }
        sequence: { type: integer, minimum: 0 }
        id_artifact: { type: integer, minimum: 1 }
    PresignVideoRequest:
      type: object
      required: [size_bytes]
      properties:
        size_bytes: { type: integer, minimum: 1 }
        content_type: { type: string }
    CompleteVideoRequest:
      type: object
      required: [object_key]
      properties:
        object_key: { type: string, minLength: 1 }
    PresignArtifactRequest:
      type: object
      required: [kind, content_type, size_bytes]
      properties:
        kind: { type: string, enum: [screenshot, network_body, console, dom, video, storage_state, other] }
        content_type: { type: string, maxLength: 150 }
        size_bytes: { type: integer, minimum: 1 }
        sequence: { type: integer, minimum: 0 }
    CompleteArtifactRequest:
      type: object
      properties:
        size_bytes: { type: integer, minimum: 1 }
        checksum_sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
    GenerateSessionRequest:
      type: object
      properties:
        kinds:
          type: array
          items: { type: string, enum: [markdown, playwright] }
    SyncCodebaseRequest:
      type: object
      properties:
        source_type: { type: string }
        base_dir: { type: string }
        repo_url: { type: string }
        branch: { type: string }
        github_token: { type: string, writeOnly: true }
        force_reindex: { type: boolean }
    SearchCodebaseRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1 }
        limit: { type: integer, minimum: 1, maximum: 50 }
        similarity_threshold: { type: number, minimum: 0, maximum: 1 }
        kind: { type: string }
    LoginResult:
      type: object
      properties:
        user:
          type: object
          properties:
            id_user:
              type: integer
            nama:
              type: string
            username:
              type: string
            input:
              type: string
        token:
          type: string
          description: JWT access token
